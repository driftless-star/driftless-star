# driftless-star pipeline run configuration.
# CLI overrides `snakemake --config key=value` beat any value here.

# Independent of the input_dir/output_dir folder name; describes the physics case.
run_name: w7x_t3d_reconstruction

# Container runtime GPU pool. One of:
# null: run every stage on CPU images with no GPU access.
# "all": run GPU images, pinning each concurrent job to one free GPU of the execution host
# ids e.g. "4,5,6,7": run GPU images with each concurrent job pinned to one free id from the pool.
gpu_ids: "0,1,2,3"
# Concurrent jobs allowed per GPU.
jobs_per_gpu: 4

input_dir: inputs/w7-x_t3d_validation
output_dir: outputs/w7-x_t3d_validation

# Input basenames (under input_dir); output basenames (under output_dir/stageN_<name>/).
filenames:
  s1_input: vmec_input.{run_name}      # Stage 1 VMEC INDATA namelist
  s1_output: wout_{run_name}.nc
  s2_output: boozmn_{run_name}.nc
  s3_config: sfincs_input.{run_name}   # Stage 3 SFINCS namelist
  s3_output: sfincs_jax_flux_profiles.h5
  s4_config: "{run_name}.toml"         # Stage 4 GKX template
  s4_output: neopax_fluxes.h5
  s5_config: common_input.toml         # shared by Stages 3, 4, 5
  s5_output: transport_solution.h5
  s5_signal: converge_status.json

# Pressure convergence criterion. Options:
#   rms:       sqrt(mean(((P_final - P_initial) / P_initial)^2))
#   pointwise: max(abs((P_final - P_initial) / P_initial))
convergence:
  method: pointwise
  pressure_rel_tol: 1.0e-2

# Per-stage rerun flags for the ouroboros closed-loop driver, where a stage set to false
# is frozen and loop iterations after the first reuse its iteration 1 output.
loop:
  rerun:
    stage1: false
    stage2: false
    stage3: false
    stage4: true
    stage5: true

# Stage 3 SFINCS (sfincs_jax) radial scan.
# Surface-level concurrency is controlled by `snakemake --cores`.
stage3:
  sfincs_jax:
    # --- Profile source ---
    # Options include:
    # "analytical": built from the analytical parameters in common_input.toml [profiles],
    # "transport_h5": read from the NEOPAX transport_solution.h5 named by neopax_result,
    # "prescribed": read from the profile arrays in common_input.toml.
    # The closed-loop driver overrides this to prescribed after the first iteration.
    profiles_source: analytical
    neopax_result: null

    # --- Surface selection ---
    # A null value uses [geometry].n_radial + 1 for the analytical profile grid.
    # This run uses 9 faces and scans the 8 faces outside the magnetic axis.
    # Other profile sources use the grid in their profile data.
    analytical_n_radii: null
    # num_radii: 4            # subsample this many radii inside the rho window
    # rho_min: 0.1            # lower edge of the rho window
    # rho_max: 0.9            # upper edge of the rho window
    # rho_indices: "1,5,10"   # comma-separated explicit indices instead of the full grid

    # --- Resolution ---
    ntheta: 5
    nzeta: 11
    nxi: 12
    nx: 4
    solver_tolerance: 1.0e-6

    # --- Toggles ---
    plot: true
    verbose_workers: true

# Stage 4 GKX radial scan.
# Surface-level concurrency is controlled by `snakemake --cores`.
stage4:
  # Rewrite the collected flux file's `r` grid onto the minor-radius convention Stage 5 builds its
  # own radial grid on. Stage 4 writes `r = Aminor_p * rho` from VMEC, and NEOPAX derives its minor
  # radius differently, so the two grids disagree by up to ~1%. W7-X skews +0.83%, putting NEOPAX's
  # outermost cell 2.9e-3 m past the file's last knot, which Stage 5 rejects at model construction.
  # Options include:
  # false: write the grid through unchanged
  # "boozer_volume": sqrt(volume_p / (2 pi^2 R00_boozer)), what NEOPAX builds today
  neopax_radius_relabel: "boozer_volume"

  gkx:
    # --- Profile source ---
    # Options include:
    # "analytical": built from the analytical parameters in common_input.toml [profiles],
    # "transport_h5": read from the NEOPAX transport_solution.h5 named by neopax_result,
    # "prescribed": read from the profile arrays in common_input.toml.
    # The closed-loop driver overrides this to prescribed after the first iteration.
    profiles_source: analytical
    neopax_result: null

    # --- Surface selection ---
    # Number of rho grid points for profiles_source: analytical; null falls back to the transport
    # face grid, [geometry].n_radial + 1 in common_input.toml. NEOPAX solves on n_radial cells and
    # interpolates flux files onto the n_radial + 1 faces that bound them, so that is where this
    # scan samples. For n_radial = 8 that is 9 faces, scanning the 8 nonzero ones.
    analytical_n_radii: null
    # num_radii: 4            # subsample this many radii inside the rho window
    # rho_min: 0.0            # lower edge of the rho window
    # rho_max: 1.0            # upper edge of the rho window
    # rho_indices: "1,2,3"    # comma-separated explicit indices instead of the window

    # --- Resolution / time window ---
    nx: 64
    ny: 64
    ntheta: 64
    t_max: 500.0
    average_window: 100
    # Trinity3D's saturated-flux estimator. Options include:
    # "window_mean": mean over the final average_window of the trace
    # "t3d_median": median of the trailing medians
    average_reducer: t3d_median
    sample_stride: 50
    diagnostics_stride: 1

    # --- Diagnostics output ---
    # Overrides [output].resolved_diagnostics in the Stage 4 GKX template. Options include:
    # true: retain every chunk's full kx/ky/z diagnostic spectra in host RAM
    # false: skip them
    resolved_diagnostics: false

    # --- Turbulence response (perturbed fluxes) ---
    # response_mode `fd_gradients` adds one perturbed sibling run per listed (channel,
    # species) pair per flux surface, multiplying the Stage 4 job count. `none` (or
    # removing the key) runs baseline fluxes only.
    response_mode: fd_gradients
    # Species to perturb per channel: comma-separated quoted names drawn from the
    # runtime species (e, ion). A name matching no runtime species, including
    # electrons under an adiabatic electron model, prints a warning at prepare time
    # and generates no perturbed runs for that name, so only the unperturbed base
    # runs execute for it.
    # perturb_density_species: "D"       # density-gradient channel
    perturb_temperature_species: "ion"   # temperature-gradient channel
    # Perturbation parameters default to 0.5 under fd_gradients mode when left unset.
    dkap_density: 0.5
    dkap_temperature: 0.5
    perturb_rel_step: 0.5

    # --- Toggles ---
    plot: true
    plot_run_heat_traces: true
    verbose_workers: true
