[general]
mode = "transport"

[geometry]
vmec_file = "../../outputs/qa/stage1_equilibrium/wout_qa_landreman_paul_2021.nc"
boozer_file = "../../outputs/qa/stage2_boozer/boozmn_qa_landreman_paul_2021.nc"
n_radial = 8
rho_edge = 1.0

[neoclassical]
flux_model = "dkx_fluxes_r_file"
entropy_model = "none"
neoclassical_file = "../../outputs/qa/stage3_neoclassical/dkx_flux_profiles.h5"
lagged_response_mode = "fd"

[turbulence]
flux_model = "fluxes_r_file"
turbulence_file = "../../outputs/qa/stage4_turbulence/neopax_fluxes.h5"
lagged_response_mode = "fd"

[classical]
flux_model = "none"

[energy_grid]
